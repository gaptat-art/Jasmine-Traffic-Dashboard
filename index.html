<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MTR & Light Rail Live Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black min-h-screen p-3 sm:p-5 font-sans antialiased">

  <div class="max-w-xl mx-auto space-y-4">
    
    <!-- Top Header Bar -->
    <header class="border-b-2 border-black pb-3">
      <div class="flex justify-between items-start">
        <div>
          <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-black uppercase">
            MTR Commute Dashboard
          </h1>
          <div class="flex items-center gap-3 text-sm font-bold text-black mt-1">
            <span id="current-time">18:25:31</span>
            <span>•</span>
            <span>刷新倒數: <span id="countdown">20</span>s</span>
          </div>
        </div>

        <button id="refresh-btn" class="border-2 border-black px-3 py-1.5 font-black text-center text-xs sm:text-sm active:bg-black active:text-white transition-colors">
          刷新<br/><span class="text-[9px] tracking-widest">REFRESH</span>
        </button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="space-y-6">
      
      <!-- Section 1: 上班 Morning Commute -->
      <section>
        <div class="flex items-center gap-2 border-l-[6px] border-black pl-2.5 mb-3">
          <h2 class="text-xl sm:text-2xl font-black text-black">
            上班 <span class="text-base font-bold">Morning Commute</span>
          </h2>
        </div>

        <div class="space-y-3">
          <!-- MTR Yuen Long Box -->
          <div class="border-2 border-black p-3 bg-white">
            <div class="flex justify-between items-baseline border-b-2 border-black pb-1.5 mb-2">
              <span class="text-2xl font-black text-black">屯馬綫</span>
              <span class="text-sm sm:text-base font-bold text-black">往 屯門 / 天水圍</span>
            </div>
            <div id="shangban-mtr" class="divide-y border-dashed border-gray-400">
              <div class="py-2 text-sm font-bold animate-pulse text-black">載入中...</div>
            </div>
          </div>

          <!-- LRT Tin Shui Wai Box -->
          <div class="border-2 border-black p-3 bg-white">
            <div class="flex justify-between items-baseline border-b-2 border-black pb-1.5 mb-2">
              <span class="text-xl sm:text-2xl font-black text-black">輕鐵天水圍站</span>
              <span class="text-sm font-bold text-black">706 / 751 (往天逸)</span>
            </div>
            <div id="shangban-lrt" class="divide-y border-dashed border-gray-400">
              <div class="py-2 text-sm font-bold animate-pulse text-black">載入中...</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Section 2: 下班 Evening Commute -->
      <section>
        <div class="flex items-center gap-2 border-l-[6px] border-black pl-2.5 mb-3">
          <h2 class="text-xl sm:text-2xl font-black text-black">
            下班 <span class="text-base font-bold">Evening Return</span>
          </h2>
        </div>

        <div class="space-y-3">
          <!-- LRT Chung Fu / Hospital Box -->
          <div class="border-2 border-black p-3 bg-white">
            <div class="flex justify-between items-baseline border-b-2 border-black pb-1.5 mb-2">
              <span class="text-xl sm:text-2xl font-black text-black">頌富 / 醫院</span>
              <span class="text-sm font-bold text-black">705 循環綫</span>
            </div>
            <div id="xiaban-lrt" class="divide-y border-dashed border-gray-400">
              <div class="py-2 text-sm font-bold animate-pulse text-black">載入中...</div>
            </div>
          </div>

          <!-- MTR Tin Shui Wai Box -->
          <div class="border-2 border-black p-3 bg-white">
            <div class="flex justify-between items-baseline border-b-2 border-black pb-1.5 mb-2">
              <span class="text-2xl font-black text-black">屯馬綫</span>
              <span class="text-sm sm:text-base font-bold text-black">往 元朗 / 烏溪沙</span>
            </div>
            <div id="xiaban-mtr" class="divide-y border-dashed border-gray-400">
              <div class="py-2 text-sm font-bold animate-pulse text-black">載入中...</div>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>
    const MTR_YUL_API = "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=YUL";
    const MTR_TIS_API = "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=TIS";
    
    const LRT_TSW_URLS = [
      "https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=430",
      "https://rt.data.gov.hk/v1/transport/mtr/lrnt/getSchedule?station_id=430"
    ];
    const LRT_HOSP_URLS = [
      "https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=468",
      "https://rt.data.gov.hk/v1/transport/mtr/lrnt/getSchedule?station_id=468"
    ];

    const DESTINATION_MAP = {
      "TUM": "屯門",
      "WKS": "烏溪沙",
      "HUH": "紅磡",
      "KSR": "錦上路",
      "YUL": "元朗",
      "TIS": "天水圍"
    };

    let timerSeconds = 20;
    let countdownInterval = null;

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("refresh-btn").addEventListener("click", manualRefresh);
      startClock();
      loadDashboard();
      startTimer();
    });

    function startClock() {
      setInterval(() => {
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];
        document.getElementById("current-time").innerText = timeStr;
      }, 1000);
    }

    async function fetchJsonWithFallback(url) {
      try {
        const res = await fetch(url);
        if (res.ok) return await res.json();
      } catch (e) {
        console.warn("Direct fetch failed, trying proxy:", url);
      }
      try {
        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(url);
        const res = await fetch(proxyUrl);
        if (res.ok) return await res.json();
      } catch (e) {
        console.error("Proxy fetch failed:", url);
      }
      return null;
    }

    async function fetchLrtWithFallback(urls) {
      for (const url of urls) {
        const data = await fetchJsonWithFallback(url);
        if (data && (data.platform_list || data.platform)) {
          return data;
        }
      }
      return null;
    }

    async function loadDashboard() {
      const [mtrYulData, mtrTisData, lrtTswData, lrtHospData] = await Promise.all([
        fetchJsonWithFallback(MTR_YUL_API),
        fetchJsonWithFallback(MTR_TIS_API),
        fetchLrtWithFallback(LRT_TSW_URLS),
        fetchLrtWithFallback(LRT_HOSP_URLS)
      ]);

      renderMTR(mtrYulData, mtrTisData);
      renderLRT(lrtTswData, lrtHospData);
    }

    function renderMTR(yulData, tisData) {
      const yulObj = yulData?.data?.["TML-YUL"] || {};
      let shangbanTrains = yulObj.UP || [];

      const tisObj = tisData?.data?.["TML-TIS"] || {};
      let xiabanTrains = tisObj.DOWN || [];

      document.getElementById("shangban-mtr").innerHTML = renderMTRRows(shangbanTrains);
      document.getElementById("xiaban-mtr").innerHTML = renderMTRRows(xiabanTrains);
    }

    function renderMTRRows(trainList) {
      if (!trainList || trainList.length === 0) {
        return `<div class="py-2 text-sm font-bold text-gray-500">暫無班次資料</div>`;
      }

      return trainList.slice(0, 3).map(train => {
        const isArriving = train.ttnt === "0" || train.ttnt === "1";
        const minText = isArriving ? "即將" : `${train.ttnt} min`;
        const clockTime = train.time ? train.time.substring(11, 16) : "--:--";

        return `
          <div class="flex justify-between items-center py-2 border-b border-dashed border-gray-400 last:border-b-0 text-lg font-black text-black">
            <div>
              <span>${clockTime}</span>
              <span class="text-sm font-bold ml-1.5">(月台 ${train.plat || '1'})</span>
            </div>
            <span class="text-xl font-black">${minText}</span>
          </div>
        `;
      }).join('');
    }

    function renderLRT(tswData, hospData) {
      // Morning Commute: Route 706 OR Route 751 bound for 天逸
      const shangbanRoutes = parseLRT(tswData, (routeNo, dest) => {
        if (routeNo === "706") return true;
        if (routeNo === "751" && dest.includes("天逸")) return true;
        return false;
      });

      // Evening Commute: Route 705
      const xiabanRoutes = parseLRT(hospData, (routeNo) => routeNo === "705");

      document.getElementById("shangban-lrt").innerHTML = renderLRTRows(shangbanRoutes);
      document.getElementById("xiaban-lrt").innerHTML = renderLRTRows(xiabanRoutes);
    }

    function parseLRT(apiData, filterFn) {
      if (!apiData) return [];
      const platforms = apiData.platform_list || apiData.platform || [];
      if (!Array.isArray(platforms)) return [];

      let routes = [];
      platforms.forEach(p => {
        const pId = p.platform_id || p.id || '-';
        const list = p.route_list || p.route || [];

        if (Array.isArray(list)) {
          list.forEach(r => {
            const routeNo = String(r.route_no || r.route_number || '');
            const dest = String(r.dest_ch || r.dest_en || 'Special');
            
            if (!filterFn || filterFn(routeNo, dest)) {
              routes.push({
                platform: pId,
                routeNo: routeNo || 'N/A',
                dest: dest,
                time: r.time_ch || r.time_en || 'Arriving'
              });
            }
          });
        }
      });
      return routes;
    }

    function renderLRTRows(routes) {
      if (!routes || routes.length === 0) {
        return `<div class="py-2 text-sm font-bold text-gray-500">暫無班次資料</div>`;
      }

      return routes.slice(0, 3).map(r => `
        <div class="flex justify-between items-center py-2 border-b border-dashed border-gray-400 last:border-b-0 text-lg font-black text-black">
          <div>
            <span class="bg-black text-white px-1.5 py-0.5 text-sm mr-1.5 font-bold">${r.routeNo}</span>
            <span class="text-sm font-bold">(月台 ${r.platform})</span>
          </div>
          <span class="text-lg font-black">${r.time}</span>
        </div>
      `).join('');
    }

    function startTimer() {
      clearInterval(countdownInterval);
      timerSeconds = 20;
      updateTimerUI();

      countdownInterval = setInterval(() => {
        timerSeconds--;
        updateTimerUI();

        if (timerSeconds <= 0) {
          loadDashboard();
          timerSeconds = 20;
        }
      }, 1000);
    }

    function updateTimerUI() {
      document.getElementById("countdown").innerText = timerSeconds;
    }

    function manualRefresh() {
      loadDashboard();
      startTimer();
    }
  </script>
</body>
</html>
